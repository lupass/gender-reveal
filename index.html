<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#141915">
	<title>Un cuento por descubrir</title>
	<link rel="icon" href="icon.png" type="image/png">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<script src="script.js" defer></script>
</head>
<body>
	<div id="comic-viewer" aria-label="Cómic de revelación">
		<div class="comic-backdrop" aria-hidden="true">
			<img id="comic-backdrop-image" src="p1.jpg" alt="">
		</div>
		<div class="comic-art">
			<img id="comic-page-image" src="p1.jpg" alt="Página 1 del cómic" fetchpriority="high">
		</div>
		<span class="comic-counter" id="comic-counter" aria-hidden="true">1 / 6</span>
		<div class="comic-reveal" id="comic-reveal" aria-live="polite" aria-hidden="true">
			<div class="reveal-copy">
				<p class="reveal-label" id="reveal-label"></p>
				<h1 class="reveal-names">
					<span class="reveal-name" id="reveal-name-petra"></span>
					<span aria-hidden="true">&amp;</span>
					<span class="reveal-name" id="reveal-name-pedro"></span>
				</h1>
				<p class="reveal-subtitle">¡Petra y Pedro, la pareja más inesperada!</p>
			</div>
		</div>
		<button class="comic-zone comic-zone--previous" id="comic-previous" type="button" aria-label="Página anterior">
			<span class="comic-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
		</button>
		<button class="comic-zone comic-zone--next" id="comic-next" type="button" aria-label="Página siguiente">
			<span class="comic-arrow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="m9 18 6-6-6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
		</button>
	</div>
</body>
</html>
